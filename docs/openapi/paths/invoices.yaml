# REST API v1 — invoices. Paths are referenced from ../openapi.yaml.
/api/v1/invoices:
  get:
    tags:
    - Rechnungen
    summary: Rechnungen auflisten
    description: |
      Neue Rechnungen sind Entwürfe ohne Rechnungsnummer; ändern und löschen geht nur im Status `draft`.

      **Scopes:** `invoices:read`
    operationId: InvoicesIndex
    security:
    - apiToken: []
    x-required-scopes:
    - invoices:read
    parameters:
    - name: status
      in: query
      schema:
        type: string
        enum:
        - draft
        - sent
        - paid
        - cancelled
    - $ref: ../components/common.yaml#/parameters/Q
    - $ref: ../components/common.yaml#/parameters/UpdatedSince
    - $ref: ../components/common.yaml#/parameters/Sort
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: Liste (seitenweise).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/common.yaml#/schemas/InvoiceResource
                meta:
                  $ref: ../components/common.yaml#/schemas/ListMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
  post:
    tags:
    - Rechnungen
    summary: Rechnung anlegen
    description: |
      **Scopes:** `invoices:write`
    operationId: InvoicesStore
    security:
    - apiToken: []
    x-required-scopes:
    - invoices:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/InvoiceInput
    responses:
      '201':
        description: Angelegt.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/common.yaml#/schemas/InvoiceDetailResource
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '422':
        $ref: ../components/common.yaml#/responses/Unprocessable
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
/api/v1/invoices/{id}:
  get:
