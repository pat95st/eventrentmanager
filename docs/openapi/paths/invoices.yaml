    - $ref: ../components/common.yaml#/parameters/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/InvoicePatch
    responses:
      '200':
        description: Erfolgreich.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/common.yaml#/schemas/InvoiceDetailResource
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '409':
        $ref: ../components/common.yaml#/responses/Conflict
      '422':
        $ref: ../components/common.yaml#/responses/Unprocessable
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
  delete:
    tags:
    - Rechnungen
    summary: Rechnung löschen
    description: |
      **Scopes:** `invoices:write`
    operationId: InvoicesDestroy
    security:
    - apiToken: []
    x-required-scopes:
    - invoices:write
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    responses:
      '204':
        $ref: ../components/common.yaml#/responses/NoContent
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '409':
        $ref: ../components/common.yaml#/responses/Conflict
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
