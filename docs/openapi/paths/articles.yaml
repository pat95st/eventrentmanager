# REST API v1 — articles. Paths are referenced from ../openapi.yaml.
/api/v1/articles:
  get:
    tags:
    - Articles
    summary: List articles
    description: |
      **Scopes:** `articles:read`
    operationId: ArticlesIndex
    security:
    - apiToken: []
    x-required-scopes:
    - articles:read
    parameters:
    - name: active
      in: query
      description: '`1` = active articles only.'
      schema:
        type: string
        enum:
        - '1'
    - name: manufacturer_id
      in: query
      schema:
        type: string
    - name: category_id
      in: query
      schema:
        type: string
    - $ref: ../components/common.yaml#/parameters/Q
    - $ref: ../components/common.yaml#/parameters/UpdatedSince
    - $ref: ../components/common.yaml#/parameters/Sort
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: List (paginated).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/common.yaml#/schemas/ArticleResource
                meta:
                  $ref: ../components/common.yaml#/schemas/ListMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
  post:
    tags:
    - Articles
    summary: Create article
    description: |
      **Scopes:** `articles:write`
    operationId: ArticlesStore
    security:
    - apiToken: []
    x-required-scopes:
    - articles:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/ArticleInput
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/common.yaml#/schemas/ArticleDetailResource
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '422':
        $ref: ../components/common.yaml#/responses/Unprocessable
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
/api/v1/articles/{id}:
