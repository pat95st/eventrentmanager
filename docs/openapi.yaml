openapi: 3.0.3
info:
  title: Materialverleih – API
  version: "1.0"
  description: |
    Übersicht aller maschinenlesbaren Schnittstellen der Materialverleih-Software.

    Alle Pfade sind relativ zur Basis-URL der Installation, z. B. `https://verleih.example.de`.
    Keine der Schnittstellen nutzt Session-Cookies oder CSRF-Schutz; die Authentifizierung
    erfolgt je nach Bereich über einen Bearer-Token, einen Token im Pfad oder einen geheimen
    Einladungscode.

    | Bereich | Pfad-Präfix | Zugang | Ausführliche Beschreibung |
    |---|---|---|---|
    | Artikel (REST) | `/api/v1` | API-Token (`Einstellungen › API`) | – |
    | Abspielgerät | `/api/player/v1` | Geräte-Token `mvp_…` | `docs/abspielgeraet-api.md` |
    | Run-Sheet / Stagedisplay | `/api/runsheet/v1/{token}` | Token eines Freigabe-Links | `docs/stagedisplay-api.md` |
    | Stage- & FOH-Displays | `/api/display/v1` | Display-Token `mvd_…` | `docs/display-api.md` |
    | Partner-Instanzen | `/api/federation/v1` | Partnerschafts-Token / Einladungscode | `docs/partner-instanzen-api.md` |
    | Online-Zahlung | `/api/payments` | – (Webhook) | – |

    Innerhalb einer API-Version kommen nur neue Felder hinzu; Clients müssen unbekannte Felder ignorieren.
    Alle Zeitangaben sind ISO 8601 mit Zeitzonen-Offset.

    Diese Datei ist die Quelle der kompilierten Dokumentation `api-docs.html` im Repository-Wurzelverzeichnis.
    Neu bauen mit: `bin/build-api-docs.sh`
servers:
  - url: https://verleih.example.de
    description: Beispiel-Installation (eigene Basis-URL einsetzen)

tags:
  - name: Artikel
    description: |
      Lesende REST-API für Artikel. Muss unter **Einstellungen › API** aktiviert werden; ist sie
      deaktiviert, antwortet jede Route mit `404`. Tokens können auf IP-Adressen/-Bereiche
      eingeschränkt werden (sonst `403`).
  - name: Abspielgerät
    description: |
      Schnittstelle für das Abspielgerät (Raspberry Pi am Mischpult) für Veranstaltungs-Audio:
      Kopplung, Manifest der Audio-Dateien, Warteschlange von Durchsagen/Einspielern und
      Statusrückmeldung. Das Gerät fragt `state` alle `poll_interval_seconds` ab; jede Abfrage
      zählt als Lebenszeichen (offline nach 45 s).

      | `queue[].kind` | Inhalt | Abspielen |
      |---|---|---|
      | `jingle` | `file_id`/`file_url` | Datei aus dem lokalen Cache abspielen |
      | `audio` | `file_id`/`file_url` | Datei abspielen |
      | `tts` | `text`, `language` | ggf. Gong → Text per Sprachausgabe sprechen |
      | `recording` | `recording_url`, `recording_mime` | ggf. Gong → Aufnahme abspielen |
      | `stop` | – | laufende Wiedergabe sofort beenden, dann `done` melden |
  - name: Run-Sheet
    description: |
      Live-Stand eines Minutenprogramms für Stagedisplays und andere externe Clients.
      Zugang ist der Token eines **Freigabe-Links** des Minutenprogramms: „Nur lesen“ erlaubt
      `GET`, „Lesen & bearbeiten“ zusätzlich die steuernden `POST`-Endpunkte. Wird der Link
      widerrufen, antwortet die API mit `404`. Alle Antworten senden `Access-Control-Allow-Origin: *`.
  - name: Display
    description: |
      Schnittstelle für fest eingerichtete Stage- und FOH-Displays mit eigenem Geräte-Token.
      Welches Minutenprogramm ein Display zeigt, wird zentral in der Verwaltung festgelegt.
      `runSheet` hat genau das Format der Run-Sheet-API. Steuernde Endpunkte sind nur für
      FOH-Displays mit „Steuern erlauben“ zulässig. CORS ist offen (inkl. `Authorization`).
  - name: Partner-Instanzen
    description: |
      Server-zu-Server-Protokoll zwischen zwei Installationen („Föderation“). Werte sind immer
      **aus Sicht des Absenders** angegeben (`discount_granted` = Rabatt, den der Absender dem
      Empfänger gewährt). Die Einladungs-Endpunkte werden über den geheimen Code im Pfad
      authentifiziert, alle anderen über den beim Annehmen ausgetauschten Bearer-Token.
  - name: Online-Zahlung
    description: Eingehende Benachrichtigungen von Zahlungsanbietern.

x-tagGroups:
  - name: Öffentliche REST-API
    tags: [Artikel]
  - name: Veranstaltungstechnik
    tags: [Abspielgerät, Run-Sheet, Display]
  - name: Integrationen
    tags: [Partner-Instanzen, Online-Zahlung]

paths:
  # ------------------------------------------------------------------ Artikel
  /api/v1/articles:
    get:
      tags: [Artikel]
      operationId: listArticles
      summary: Artikel auflisten
      security: [{ apiToken: [] }]
      parameters:
        - name: q
          in: query
          description: Suchbegriff (Name, Hersteller, Kategorie …).
          schema: { type: string }
        - name: active
          in: query
          description: "`1` = nur aktive Artikel."
          schema: { type: string, enum: ["1"] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Seite von Artikeln.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Article" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer, example: 1 }
                      page_size: { type: integer, example: 100 }
                      total: { type: integer, example: 342 }
                      total_pages: { type: integer, example: 4 }
        "401": { $ref: "#/components/responses/ApiUnauthorized" }
        "403": { $ref: "#/components/responses/ApiIpForbidden" }
        "404": { $ref: "#/components/responses/ApiDisabled" }
  /api/v1/articles/{id}:
    get:
      tags: [Artikel]
      operationId: getArticle
      summary: Artikel abrufen
      description: Wie in der Liste, zusätzlich mit Inventarnummern.
      security: [{ apiToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: Artikel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ArticleDetail" }
        "401": { $ref: "#/components/responses/ApiUnauthorized" }
        "403": { $ref: "#/components/responses/ApiIpForbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/articles/{id}/images/{imageId}:
    get:
      tags: [Artikel]
      operationId: getArticleImage
      summary: Artikelbild herunterladen
      security: [{ apiToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ArticleId"
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bilddatei.
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/ApiUnauthorized" }
        "403": { $ref: "#/components/responses/ApiIpForbidden" }
        "404": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------- Abspielgerät
  /api/player/v1/pair:
    post:
      tags: [Abspielgerät]
      operationId: playerPair
      summary: Gerät per Code koppeln
      description: |
        Koppelt ein Gerät per 6-stelligem Code (in der Veranstaltung unter **Audio & Durchsagen**
        erzeugt, 15 Minuten und einmal gültig) an eine Veranstaltung. Benötigt **keinen** Token.

        Sendet das Gerät zusätzlich einen gültigen `Authorization: Bearer <Token>`, wird das
        vorhandene Gerät der neuen Veranstaltung zugeordnet und behält seinen Token
        (`token: null`). Sonst wird ein neues Gerät angelegt und der Token **einmalig** geliefert.
      security: [{}, { playerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Leerzeichen und Bindestriche werden ignoriert.
                  example: "123456"
                name:
                  type: string
                  description: Gerätename (Standard „AutoEventPlay“).
                  example: Pi Mischpult
                version: { type: string, example: 1.0.0 }
      responses:
        "200":
          description: Gekoppelt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  token: { type: string, nullable: true, example: mvp_… }
                  player: { $ref: "#/components/schemas/PlayerRef" }
                  rental: { $ref: "#/components/schemas/PlayerRental" }
                  poll_interval_seconds: { type: integer, example: 2 }
        "422":
          description: Code ungültig oder abgelaufen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: 10 Fehlversuche derselben IP innerhalb von 15 Minuten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/player/v1/state:
    get:
      tags: [Abspielgerät]
      operationId: playerState
      summary: Zustand, Manifest und Warteschlange abfragen
      description: |
        Wird alle `poll_interval_seconds` abgefragt. Erreicht ein geplanter Einspieler seine
        Startzeit, legt der Server dabei automatisch einen Auftrag in `queue` an. Aufträge, die
        zu lange nicht abgeholt wurden, verfallen serverseitig.
      security: [{ playerToken: [] }]
      parameters:
        - name: version
          in: query
          description: Version der Geräte-Software (Anzeige in der Geräteübersicht).
          schema: { type: string }
        - name: playing
          in: query
          description: Klartext, was gerade läuft (z. B. „Opener“); leer = nichts.
          schema: { type: string }
      responses:
        "200":
          description: Aktueller Zustand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/player/v1/requests/{id}/status:
    post:
      tags: [Abspielgerät]
      operationId: playerReportStatus
      summary: Status eines Auftrags melden
      security: [{ playerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlayerStatusInput" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/PlayerStatusInput" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Auftrag gehört nicht zur Veranstaltung dieses Geräts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Ungültiger Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/player/v1/requests/{id}/recording:
    get:
      tags: [Abspielgerät]
      operationId: playerRecording
      summary: Mikrofon-Aufnahme eines Auftrags herunterladen
      security: [{ playerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Aufnahme (`audio/webm`, `audio/mp4` oder `audio/ogg`).
          content:
            audio/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /api/player/v1/files/{id}:
    get:
      tags: [Abspielgerät]
      operationId: playerFile
      summary: Audio-Datei herunterladen
      description: Unterstützt Range-Anfragen. Nur Dateien von Veranstaltungen, die dem Gerät zugeordnet sind.
      security: [{ playerToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string, example: bytes=0-1023 }
      responses:
        "200":
          description: Datei (WAV, FLAC, AAC/M4A oder MP3).
          content:
            audio/*:
              schema: { type: string, format: binary }
        "206": { description: Teilinhalt (Range). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /api/player/v1/gong:
    get:
      tags: [Abspielgerät]
      operationId: playerGong
      summary: Eigenen Gong herunterladen
      security: [{ playerToken: [] }]
      responses:
        "200":
          description: Gong-Datei.
          content:
            audio/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Kein eigener Gong hinterlegt – eingebauten Gong verwenden.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- Run-Sheet
  /api/runsheet/v1/{token}:
    get:
      tags: [Run-Sheet]
      operationId: runSheetState
      security: []
      summary: Kompletter Live-Stand
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Live-Stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSheet" }
        "404": { $ref: "#/components/responses/OkFalse404" }
  /api/runsheet/v1/{token}/delay:
    post:
      tags: [Run-Sheet]
      operationId: runSheetDelay
      security: []
      summary: Verzug setzen/ändern
      description: Erfordert einen Link „Lesen & bearbeiten“.
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      requestBody: { $ref: "#/components/requestBodies/DelayInput" }
      responses:
        "200": { $ref: "#/components/responses/RunSheetOk" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "404": { $ref: "#/components/responses/OkFalse404" }
        "422": { $ref: "#/components/responses/OkFalse422" }
  /api/runsheet/v1/{token}/items/{itemId}/start:
    post:
      tags: [Run-Sheet]
      operationId: runSheetStart
      security: []
      summary: Programmpunkt starten
      description: Ohne Daten gilt „jetzt“. Erfordert einen Link „Lesen & bearbeiten“.
      parameters:
        - $ref: "#/components/parameters/ShareToken"
        - $ref: "#/components/parameters/ItemId"
      requestBody: { $ref: "#/components/requestBodies/StartInput" }
      responses:
        "200": { $ref: "#/components/responses/RunSheetOk" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "404": { $ref: "#/components/responses/OkFalse404" }
        "422": { $ref: "#/components/responses/OkFalse422" }
  /api/runsheet/v1/{token}/finish:
    post:
      tags: [Run-Sheet]
      operationId: runSheetFinish
      security: []
      summary: Programm beenden
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200": { $ref: "#/components/responses/RunSheetOk" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "404": { $ref: "#/components/responses/OkFalse404" }
  /api/runsheet/v1/{token}/reset:
    post:
      tags: [Run-Sheet]
      operationId: runSheetReset
      security: []
      summary: Live-Stand zurücksetzen
      description: Stellt den ursprünglichen Plan wieder her.
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200": { $ref: "#/components/responses/RunSheetOk" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "404": { $ref: "#/components/responses/OkFalse404" }

  # ------------------------------------------------------------------ Display
  /api/display/v1/state:
    get:
      tags: [Display]
      operationId: displayState
      summary: Konfiguration und Live-Stand
      description: Jede Abfrage zählt als Lebenszeichen (offline nach 45 s).
      security: [{ displayToken: [] }]
      parameters:
        - name: version
          in: query
          description: Version des Clients (Anzeige in der Geräteübersicht).
          schema: { type: string }
      responses:
        "200":
          description: Zustand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisplayState" }
        "401": { $ref: "#/components/responses/OkFalse401" }
  /api/display/v1/delay:
    post:
      tags: [Display]
      operationId: displayDelay
      summary: Verzug setzen/ändern
      security: [{ displayToken: [] }]
      requestBody: { $ref: "#/components/requestBodies/DelayInput" }
      responses:
        "200": { $ref: "#/components/responses/DisplayOk" }
        "401": { $ref: "#/components/responses/OkFalse401" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "409": { $ref: "#/components/responses/OkFalse409" }
        "422": { $ref: "#/components/responses/OkFalse422" }
  /api/display/v1/items/{itemId}/start:
    post:
      tags: [Display]
      operationId: displayStart
      summary: Programmpunkt starten
      security: [{ displayToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody: { $ref: "#/components/requestBodies/StartInput" }
      responses:
        "200": { $ref: "#/components/responses/DisplayOk" }
        "401": { $ref: "#/components/responses/OkFalse401" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "404": { $ref: "#/components/responses/OkFalse404" }
        "409": { $ref: "#/components/responses/OkFalse409" }
        "422": { $ref: "#/components/responses/OkFalse422" }
  /api/display/v1/finish:
    post:
      tags: [Display]
      operationId: displayFinish
      summary: Programm beenden
      security: [{ displayToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/DisplayOk" }
        "401": { $ref: "#/components/responses/OkFalse401" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "409": { $ref: "#/components/responses/OkFalse409" }
  /api/display/v1/reset:
    post:
      tags: [Display]
      operationId: displayReset
      summary: Live-Stand zurücksetzen
      security: [{ displayToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/DisplayOk" }
        "401": { $ref: "#/components/responses/OkFalse401" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "409": { $ref: "#/components/responses/OkFalse409" }
  /api/display/v1/messages/{messageId}/seen:
    post:
      tags: [Display]
      operationId: displayMessageSeen
      summary: Nachricht als gesehen markieren
      security: [{ displayToken: [] }]
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200": { $ref: "#/components/responses/DisplayOk" }
        "401": { $ref: "#/components/responses/OkFalse401" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "404": { $ref: "#/components/responses/OkFalse404" }
        "409": { $ref: "#/components/responses/OkFalse409" }
  /api/display/v1/messages/{messageId}/hide:
    post:
      tags: [Display]
      operationId: displayMessageHide
      summary: Nachricht ausblenden (auch auf der Bühne)
      security: [{ displayToken: [] }]
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200": { $ref: "#/components/responses/DisplayOk" }
        "401": { $ref: "#/components/responses/OkFalse401" }
        "403": { $ref: "#/components/responses/OkFalse403" }
        "404": { $ref: "#/components/responses/OkFalse404" }
        "409": { $ref: "#/components/responses/OkFalse409" }

  # -------------------------------------------------------- Partner-Instanzen
  /api/federation/v1/invitations/{code}:
    get:
      tags: [Partner-Instanzen]
      operationId: federationInvitation
      security: []
      summary: Einladung prüfen
      description: Liefert Name, Basis-URL und Anschrift der einladenden Instanz.
      parameters:
        - $ref: "#/components/parameters/InvitationCode"
      responses:
        "200":
          description: Einladende Instanz.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationSelf" }
        "404":
          description: Link ungültig, abgelaufen (7 Tage) oder bereits verwendet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/federation/v1/invitations/{code}/accept:
    post:
      tags: [Partner-Instanzen]
      operationId: federationAcceptInvitation
      security: []
      summary: Einladung annehmen
      description: |
        Die eingeladene Instanz nimmt an. `token` ist der Token, mit dem die einladende Instanz
        künftig den Absender aufruft; die Antwort enthält umgekehrt den Token für den Absender.
        Die Partnerschaft steht danach auf `pending_confirmation` bei der einladenden Instanz.
      parameters:
        - $ref: "#/components/parameters/InvitationCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_url, token]
              properties:
                name: { type: string, maxLength: 255 }
                base_url: { type: string, format: uri }
                profile: { $ref: "#/components/schemas/PartnerProfile" }
                token: { type: string, pattern: "^[A-Za-z0-9]{32,128}$" }
                discount_granted: { type: number, minimum: 0, maximum: 100, example: 10 }
                discount_received: { type: number, minimum: 0, maximum: 100, example: 10 }
      responses:
        "200":
          description: Angenommen.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FederationSelf"
                  - type: object
                    properties:
                      token: { type: string, description: Token für künftige Aufrufe des Absenders. }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Es besteht bereits eine Partnerschaft mit dieser Instanz.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/federation/v1/partnership:
    get:
      tags: [Partner-Instanzen]
      operationId: federationPartnership
      summary: Status der Partnerschaft
      description: Auch als Verbindungstest nutzbar.
      security: [{ federationToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Partnership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
  /api/federation/v1/partnership/confirm:
    post:
      tags: [Partner-Instanzen]
      operationId: federationConfirm
      summary: Partnerschaft bestätigen oder ablehnen
      description: Nur wenn die Partnerschaft auf `awaiting_partner` steht.
      security: [{ federationToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [accept, decline] }
                discount: { $ref: "#/components/schemas/DiscountAction" }
      responses:
        "200":
          description: Bei `accept` der neue Partnerschaftsstand, bei `decline` nur `status`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Partnership"
                  - $ref: "#/components/schemas/StatusOnly"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/federation/v1/partnership/discount:
    post:
      tags: [Partner-Instanzen]
      operationId: federationDiscount
      summary: Rabatt vorschlagen, annehmen oder ablehnen
      description: Bis zur Zustimmung gilt der bisher vereinbarte Rabatt.
      security: [{ federationToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountAction" }
      responses:
        "200": { $ref: "#/components/responses/Partnership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/federation/v1/partnership/end:
    post:
      tags: [Partner-Instanzen]
      operationId: federationEnd
      summary: Partnerschaft beenden
      description: Danach antworten alle Endpunkte mit `403`.
      security: [{ federationToken: [] }]
      responses:
        "200":
          description: Beendet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
  /api/federation/v1/articles:
    get:
      tags: [Partner-Instanzen]
      operationId: federationArticles
      summary: Materialpool des Partners
      description: Vermietbare Artikel mit Verfügbarkeit im Zeitraum, 25 je Seite.
      security: [{ federationToken: [] }]
      parameters:
        - name: from
          in: query
          description: Beginn (Standard heute).
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Ende (Standard = `from`).
          schema: { type: string, format: date }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Artikel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FederationArticle" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      page_size: { type: integer, example: 25 }
                      total: { type: integer }
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      discount_percent: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
        "422": { $ref: "#/components/responses/Error" }
  /api/federation/v1/technicians:
    get:
      tags: [Partner-Instanzen]
      operationId: federationTechnicians
      summary: Techniker und Gewerke des Partners
      description: Geteilt werden nur Namen, keine E-Mail-Adressen.
      security: [{ federationToken: [] }]
      responses:
        "200":
          description: Techniker.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  technicians:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                  trades:
                    type: array
                    items: { type: string }
                    example: [Ton, Licht]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
  /api/federation/v1/requests:
    post:
      tags: [Partner-Instanzen]
      operationId: federationCreateRequest
      summary: Material- oder Techniker-Anfrage stellen
      description: |
        Wiederholtes Senden derselben `reference` liefert den bestehenden Stand. Bei Material und
        aktivem „automatisch zusagen“ wird die Anfrage sofort zugesagt, sofern alles verfügbar ist.
      security: [{ federationToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationRequestInput" }
      responses:
        "201": { $ref: "#/components/responses/FederationRequestState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
        "422": { $ref: "#/components/responses/Error" }
  /api/federation/v1/requests/{reference}:
    get:
      tags: [Partner-Instanzen]
      operationId: federationRequestStatus
      summary: Stand einer Anfrage des Absenders
      security: [{ federationToken: [] }]
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200": { $ref: "#/components/responses/FederationRequestState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/federation/v1/requests/{reference}/cancel:
    post:
      tags: [Partner-Instanzen]
      operationId: federationCancelRequest
      summary: Anfrage stornieren
      security: [{ federationToken: [] }]
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200": { $ref: "#/components/responses/FederationRequestState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
        "404": { $ref: "#/components/responses/Error" }
  /api/federation/v1/requests/{reference}/status:
    post:
      tags: [Partner-Instanzen]
      operationId: federationReceiveStatus
      summary: Entscheidung zu einer Anfrage melden
      description: Der anbietende Partner meldet den neuen Stand einer Anfrage, die der Empfänger gestellt hat.
      security: [{ federationToken: [] }]
      parameters:
        - $ref: "#/components/parameters/Reference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/FederationRequestStatusEnum" }
                message: { type: string, nullable: true, maxLength: 1000 }
                discount_percent: { type: number, nullable: true, minimum: 0, maximum: 100 }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/FederationRequestItem" }
                technicians:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/FederationTechnicianStatus" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/FederationForbidden" }
        "404": { $ref: "#/components/responses/Error" }

  # ----------------------------------------------------------- Online-Zahlung
  /api/payments/sumup/webhook:
    post:
      tags: [Online-Zahlung]
      operationId: sumUpWebhook
      security: []
      summary: SumUp-Webhook
      description: |
        Benachrichtigung von SumUp über einen Checkout. Der Server ordnet die Checkout-ID der
        zugehörigen Rechnung zu und bestätigt deren Online-Zahlung. Unbekannte Checkouts werden
        ignoriert; die Antwort ist immer `{"ok": true}`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, maxLength: 100, description: Checkout-ID. }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: "API-Token aus **Einstellungen › API** (`Authorization: Bearer <token>`)."
    playerToken:
      type: http
      scheme: bearer
      description: Geräte-Token des Abspielgeräts (`mvp_…`).
    displayToken:
      type: http
      scheme: bearer
      description: Display-Token (`mvd_…`), wird beim Anlegen bzw. Neu-Erzeugen einmal angezeigt.
    federationToken:
      type: http
      scheme: bearer
      description: Beim Annehmen der Einladung ausgetauschter Partnerschafts-Token.

  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: id
      in: path
      required: true
      description: ID des Auftrags aus `queue`.
      schema: { type: string }
    ShareToken:
      name: token
      in: path
      required: true
      description: Token eines Freigabe-Links des Minutenprogramms.
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      description: ID des Programmpunkts.
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    InvitationCode:
      name: code
      in: path
      required: true
      description: Geheimer Code aus dem Einladungslink.
      schema: { type: string }
    Reference:
      name: reference
      in: path
      required: true
      description: UUID der Anfrage (auf beiden Seiten gleich).
      schema: { type: string, format: uuid }

  requestBodies:
    DelayInput:
      description: Genau eine Angabe; Vorrang in der Reihenfolge der Felder. Maximal ±24 Stunden.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DelayInput" }
        application/x-www-form-urlencoded:
          schema: { $ref: "#/components/schemas/DelayInput" }
    StartInput:
      required: false
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StartInput" }
        application/x-www-form-urlencoded:
          schema: { $ref: "#/components/schemas/StartInput" }

  responses:
    Ok:
      description: Erfolg.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: true }
    Error:
      description: Fehler.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token fehlt, ist ungültig oder deaktiviert.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ApiUnauthorized:
      description: "Kein gültiger `Authorization: Bearer <token>`-Header oder Token deaktiviert."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ApiIpForbidden:
      description: Zugriff von dieser IP-Adresse ist für das Token nicht erlaubt.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ApiDisabled:
      description: API ist deaktiviert (oder Ressource nicht gefunden).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FederationForbidden:
      description: Partnerschaft beendet/abgelehnt, noch nicht bestätigt oder Aktion nicht freigegeben.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OkFalse401:
      description: Ungültiger Token oder deaktiviertes Display.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OkFalse" }
    OkFalse403:
      description: Zugang erlaubt nur das Lesen bzw. Display darf nicht steuern.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OkFalse" }
    OkFalse404:
      description: Unbekannter/widerrufener Token oder unbekannter Programmpunkt bzw. Nachricht.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OkFalse" }
    OkFalse409:
      description: Dem Display ist gerade kein Minutenprogramm zugeordnet.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OkFalse" }
    OkFalse422:
      description: Ungültige Eingabe (z. B. Verzug nicht lesbar).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OkFalse" }
    RunSheetOk:
      description: Erfolg, mit komplettem neuen Live-Stand.
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  ok: { type: boolean, example: true }
              - $ref: "#/components/schemas/RunSheet"
    DisplayOk:
      description: Erfolg, mit komplettem neuen Stand (wie `GET /api/display/v1/state`).
      content:
        application/json:
          schema:
            allOf:
              - type: object
                properties:
                  ok: { type: boolean, example: true }
              - $ref: "#/components/schemas/DisplayState"
    Partnership:
      description: Stand der Partnerschaft.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Partnership" }
    FederationRequestState:
      description: Stand der Anfrage.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FederationRequestState" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Ungültiges oder deaktiviertes Token. }
    OkFalse:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }
    StatusOnly:
      type: object
      properties:
        status: { $ref: "#/components/schemas/PartnerStatus" }

    # --- Artikel
    Article:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Line-Array-Topteil" }
        manufacturer: { type: string, nullable: true }
        category: { type: string, nullable: true }
        description: { type: string, nullable: true }
        weight:
          type: object
          nullable: true
          properties:
            value: { type: number, example: 23.5 }
            unit: { type: string, example: kg }
        dimensions: { type: string, nullable: true }
        requires_electrical_inspection: { type: boolean }
        protection_class: { type: string, nullable: true }
        billable: { type: boolean }
        active: { type: boolean }
        daily_rental_price: { type: number, nullable: true, example: 45.0 }
        images:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              url: { type: string, example: "/api/v1/articles/{id}/images/{imageId}" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ArticleDetail:
      allOf:
        - $ref: "#/components/schemas/Article"
        - type: object
          properties:
            inventory_numbers:
              type: array
              items:
                type: object
                properties:
                  number: { type: string, example: INV-0042 }
                  acquisition_date: { type: string, format: date, nullable: true }

    # --- Abspielgerät
    PlayerRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Pi Mischpult }
    PlayerRental:
      type: object
      nullable: true
      properties:
        id: { type: string }
        name: { type: string, example: Stadtfest }
        location: { type: string, nullable: true, example: Marktplatz }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    PlayerState:
      type: object
      properties:
        server_time: { type: string, format: date-time }
        poll_interval_seconds: { type: integer, example: 2 }
        player: { $ref: "#/components/schemas/PlayerRef" }
        tts:
          type: object
          properties:
            language: { type: string, example: de-DE }
            voice: { type: string, nullable: true, example: de_DE-thorsten-high }
            rate: { type: number, minimum: 0.5, maximum: 2.0, example: 1.0 }
        gong:
          type: object
          nullable: true
          description: "`null` = eingebauten Gong verwenden."
          properties:
            url: { type: string, example: /api/player/v1/gong }
            version: { type: string }
            mime: { type: string, example: audio/mpeg }
        rental:
          description: "`null`, wenn gerade keine laufende Veranstaltung zugeordnet ist."
          allOf:
            - $ref: "#/components/schemas/PlayerRental"
            - type: object
              properties:
                gong_by_default: { type: boolean }
                tts_languages:
                  type: array
                  items: { type: string }
                  example: [de-DE, en-GB]
        files:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string, example: jingle }
              title: { type: string }
              description: { type: string, nullable: true }
              filename: { type: string }
              mime: { type: string }
              size: { type: integer }
              version: { type: string, description: Ändert sich bei neuer Datei – dann neu herunterladen. }
              url: { type: string }
        minute_programs:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              start_at: { type: string, format: date-time, description: Inkl. live gepflegter Verzögerung. }
              jingle_before: { type: boolean }
              jingle_file_id: { type: string, nullable: true }
        scheduled:
          type: array
          description: Noch nicht ausgelöste geplante Einspieler, nach Zeit sortiert (nur zur Information).
          items:
            type: object
            properties:
              id: { type: string }
              file_id: { type: string }
              play_at: { type: string, format: date-time, description: Nächster Termin. }
              note: { type: string, nullable: true }
              repeat_interval_minutes: { type: integer, nullable: true }
              repeat_until: { type: string, format: date-time, nullable: true }
              repeat_max: { type: integer, nullable: true }
              repeat_count: { type: integer }
        queue:
          type: array
          description: Der Reihe nach abzuarbeiten (älteste zuerst).
          items: { $ref: "#/components/schemas/PlayerQueueItem" }
    PlayerQueueItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [jingle, audio, tts, recording, stop] }
        label: { type: string }
        file_id: { type: string, nullable: true }
        file_url: { type: string, nullable: true }
        text: { type: string, nullable: true }
        language: { type: string, description: BCP-47-Code der Durchsage., example: de-DE }
        recording_url: { type: string, nullable: true }
        recording_mime: { type: string, nullable: true }
        with_gong: { type: boolean, description: Nur bei `tts` und `recording`. }
        requested_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        status_url: { type: string, example: "/api/player/v1/requests/{id}/status" }
    PlayerStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [playing, done, failed, cancelled] }
        error: { type: string, description: Fehlerbeschreibung bei `failed`. }

    # --- Run-Sheet
    DelayInput:
      type: object
      properties:
        adopt: { type: boolean, description: Prognostizierten Verzug übernehmen. }
        adjust_seconds: { type: integer, description: Relativ zum aktuellen Verzug., example: 60 }
        delay_seconds: { type: integer, description: Absolut in Sekunden (negativ = Vorsprung)., example: 270 }
        delay:
          type: string
          description: Absolut als Text – Minuten (`5`, `-2`, `1,5`), `mm:ss` oder `h:mm:ss`.
          example: "4:30"
    StartInput:
      type: object
      properties:
        started_at:
          type: string
          description: Uhrzeit (`20:13:20`) oder ISO-8601-Zeitstempel, falls der Punkt früher begonnen hat.
    Notes:
      type: object
      description: Kompatibilitätsfelder; für neue Displays `tradeNotes` verwenden.
      properties:
        general: { type: string, nullable: true }
        sound: { type: string, nullable: true }
        light: { type: string, nullable: true }
        video: { type: string, nullable: true }
        stage: { type: string, nullable: true }
    TradeNote:
      type: object
      properties:
        tradeId: { type: string }
        trade: { type: string, example: Ton }
        color: { type: string, example: "#3b82f6" }
        text: { type: string }
    RunSheetCurrentItem:
      type: object
      nullable: true
      properties:
        id: { type: string }
        position: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        notes: { $ref: "#/components/schemas/Notes" }
        tradeNotes:
          type: array
          items: { $ref: "#/components/schemas/TradeNote" }
        noStrobe: { type: boolean }
        durationSeconds: { type: integer, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        elapsedSeconds: { type: integer, description: Beim nächsten Punkt negativ (Zeit bis zum Start). }
        remainingSeconds: { type: integer, nullable: true, description: "< 0 = überzogen." }
        actualStart: { type: string, format: date-time, nullable: true }
    RunSheetItem:
      type: object
      properties:
        id: { type: string }
        position: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        notes: { $ref: "#/components/schemas/Notes" }
        tradeNotes:
          type: array
          items: { $ref: "#/components/schemas/TradeNote" }
        noStrobe: { type: boolean }
        durationMinutes: { type: integer, nullable: true }
        status: { type: string, enum: [done, current, next, upcoming] }
        plannedStart: { type: string, format: date-time, description: Plan ohne Verzug. }
        plannedEnd: { type: string, format: date-time }
        currentStart: { type: string, format: date-time, description: Plan + gesetzter Verzug. }
        projectedStart: { type: string, format: date-time }
        projectedEnd: { type: string, format: date-time }
        actualStart: { type: string, format: date-time, nullable: true }
    RunSheetMessage:
      type: object
      properties:
        id: { type: string }
        text: { type: string, maxLength: 500 }
        urgent: { type: boolean }
        stage: { type: boolean }
        foh: { type: boolean }
        allPrograms: { type: boolean }
        sentAt: { type: string, format: date-time }
        sentBy: { type: string }
        fromFoh: { type: boolean }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        acknowledgedBy: { type: string, nullable: true }
    RunSheet:
      type: object
      properties:
        apiVersion: { type: integer, example: 1 }
        serverTime: { type: string, format: date-time }
        revision: { type: string, description: Ändert sich bei jeder Änderung von Plan oder Live-Stand., example: bd7c8561a5b09953 }
        event:
          type: object
          properties:
            name: { type: string, example: Firmengala 2026 }
            noStrobe: { type: boolean }
        program:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            room: { type: string, nullable: true }
            plannedStart: { type: string, format: date-time }
            currentStart: { type: string, format: date-time }
            plannedEnd: { type: string, format: date-time }
            projectedEnd: { type: string, format: date-time }
            jingleBefore: { type: boolean }
            jingleTitle: { type: string, nullable: true }
            handheldMicCount: { type: integer }
            headsetMicCount: { type: integer }
            itemCount: { type: integer }
        trades:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              color: { type: string }
        live:
          type: object
          properties:
            state: { type: string, enum: [pending, running, finished] }
            tracking: { type: boolean, description: "`true` = FOH-Modus, `false` = Uhr-Modus." }
            delaySeconds: { type: integer }
            projectedDelaySeconds: { type: integer, description: Wert für die Anzeige. }
            overrunSeconds: { type: integer }
            finishedAt: { type: string, format: date-time, nullable: true }
            canControl: { type: boolean }
        current: { $ref: "#/components/schemas/RunSheetCurrentItem" }
        next: { $ref: "#/components/schemas/RunSheetCurrentItem" }
        items:
          type: array
          items: { $ref: "#/components/schemas/RunSheetItem" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/RunSheetMessage" }

    # --- Display
    DisplayState:
      type: object
      properties:
        apiVersion: { type: integer, example: 1 }
        serverTime: { type: string, format: date-time }
        pollIntervalSeconds: { type: integer, example: 3 }
        display:
          type: object
          properties:
            id: { type: string }
            name: { type: string, example: Bühnenmonitor links }
            role: { type: string, enum: [stage, foh] }
            roleLabel: { type: string, example: Stagedisplay }
            canControl: { type: boolean }
            assignment:
              type: object
              properties:
                mode: { type: string, enum: [program, rental, auto] }
                rentalId: { type: string, nullable: true }
                minuteProgramId: { type: string, nullable: true }
                room: { type: string, nullable: true }
            options:
              type: object
              properties:
                notes:
                  type: array
                  items: { type: string, enum: [general, sound, light, video, stage] }
                showClock: { type: boolean }
                showDelay: { type: boolean }
                showNext: { type: boolean }
                showItemList: { type: boolean }
                showDescription: { type: boolean }
                showMics: { type: boolean }
                allowControl: { type: boolean }
                theme: { type: string, enum: [dark, light] }
                fontScale: { type: integer, minimum: 50, maximum: 200 }
            thresholds:
              type: object
              properties:
                warnSeconds: { type: integer, example: 120 }
                criticalSeconds: { type: integer, example: 30 }
            configRevision: { type: string }
        runSheet:
          description: Live-Stand des gezeigten Minutenprogramms oder `null`.
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/RunSheet"

    # --- Partner-Instanzen
    PartnerStatus:
      type: string
      enum: [awaiting_partner, pending_confirmation, active, declined, ended]
    PartnerProfile:
      type: object
      properties:
        street: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
    FederationSelf:
      type: object
      properties:
        protocol: { type: integer, example: 1 }
        name: { type: string }
        base_url: { type: string, format: uri }
        profile: { $ref: "#/components/schemas/PartnerProfile" }
    Partnership:
      allOf:
        - $ref: "#/components/schemas/FederationSelf"
        - type: object
          properties:
            status: { $ref: "#/components/schemas/PartnerStatus" }
            discount_granted: { type: number }
            discount_received: { type: number }
            allows_technician_requests: { type: boolean }
    DiscountAction:
      type: object
      properties:
        action: { type: string, enum: [propose, accept, reject] }
        granted: { type: number, minimum: 0, maximum: 100 }
        received: { type: number, minimum: 0, maximum: 100 }
    FederationArticle:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        manufacturer: { type: string, nullable: true }
        category: { type: string, nullable: true }
        daily_price: { type: number, nullable: true }
        total: { type: integer }
        available: { type: integer, description: Verfügbar im Zeitraum. }
        discount_percent: { type: number }
        discounted_daily_price: { type: number, nullable: true }
    FederationRequestItem:
      type: object
      required: [article_id, quantity]
      properties:
        article_id: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        daily_price: { type: number, nullable: true }
    FederationTechnicianStatus:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
    FederationRequestStatusEnum:
      type: string
      enum: [pending, accepted, declined, cancelled]
    FederationRequestInput:
      type: object
      required: [reference, kind, event_name, start_date, end_date]
      properties:
        reference: { type: string, format: uuid }
        kind: { type: string, enum: [material, technician] }
        event_name: { type: string, maxLength: 200 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        event_location: { type: string, nullable: true }
        note: { type: string, nullable: true, maxLength: 2000 }
        contact_name: { type: string, nullable: true }
        contact_email: { type: string, nullable: true }
        items:
          type: array
          description: Nur bei `material`.
          items:
            type: object
            required: [article_id, quantity]
            properties:
              article_id: { type: string }
              quantity: { type: integer, minimum: 1 }
        trades:
          type: array
          description: Nur bei `technician`.
          items: { type: string }
        technician_count: { type: integer, minimum: 1, maximum: 50, description: Nur bei `technician`. }
        preferred_technician_id: { type: string, nullable: true, description: Nur bei `technician`. }
    FederationRequestState:
      type: object
      properties:
        reference: { type: string, format: uuid }
        kind: { type: string, enum: [material, technician] }
        status: { $ref: "#/components/schemas/FederationRequestStatusEnum" }
        message: { type: string, nullable: true }
        discount_percent: { type: number, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationRequestItem" }
        technicians:
          type: array
          items: { $ref: "#/components/schemas/FederationTechnicianStatus" }
