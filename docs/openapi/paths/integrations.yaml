# integrations interfaces (see docs/*-api.md). Paths are referenced from ../openapi.yaml.
/api/federation/v1/invitations/{code}:
  get:
    tags:
    - Partner instances
    operationId: federationInvitation
    security: []
    summary: Check invitation
    description: Returns the name, base URL and address of the inviting instance.
    parameters:
    - $ref: ../components/legacy.yaml#/parameters/InvitationCode
    responses:
      '200':
        description: Inviting instance.
        content:
          application/json:
            schema:
              $ref: ../components/legacy.yaml#/schemas/FederationSelf
      '404':
        description: Link invalid, expired (7 days) or already used.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/Error
/api/federation/v1/invitations/{code}/accept:
  post:
    tags:
    - Partner instances
    operationId: federationAcceptInvitation
    security: []
    summary: Accept invitation
    description: |
      The invited instance accepts. `token` is the token the inviting instance will use to call
      the sender in the future; in turn, the response contains the token for the sender.
      Afterwards the partnership is in state `pending_confirmation` at the inviting instance.
    parameters:
    - $ref: ../components/legacy.yaml#/parameters/InvitationCode
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            - base_url
            - token
            properties:
              name:
                type: string
                maxLength: 255
              base_url:
                type: string
                format: uri
              profile:
                $ref: ../components/legacy.yaml#/schemas/PartnerProfile
              token:
                type: string
                pattern: ^[A-Za-z0-9]{32,128}$
              discount_granted:
                type: number
                minimum: 0
                maximum: 100
                example: 10
              discount_received:
                type: number
                minimum: 0
                maximum: 100
                example: 10
    responses:
      '200':
        description: Accepted.
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../components/legacy.yaml#/schemas/FederationSelf
              - type: object
                properties:
                  token:
                    type: string
                    description: Token for future calls to the sender.
      '404':
        $ref: ../components/legacy.yaml#/responses/Error
      '409':
        description: A partnership with this instance already exists.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/Error
      '422':
        $ref: ../components/legacy.yaml#/responses/Error
/api/federation/v1/partnership:
  get:
    tags:
    - Partner instances
    operationId: federationPartnership
    summary: Partnership status
    description: Can also be used as a connection test.
    security:
    - federationToken: []
    responses:
      '200':
        $ref: ../components/legacy.yaml#/responses/Partnership
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
/api/federation/v1/partnership/confirm:
  post:
    tags:
    - Partner instances
    operationId: federationConfirm
    summary: Confirm or decline partnership
    description: Only while the partnership is in state `awaiting_partner`.
    security:
    - federationToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              decision:
                type: string
                enum:
                - accept
                - decline
              discount:
                $ref: ../components/legacy.yaml#/schemas/DiscountAction
    responses:
      '200':
        description: For `accept` the new partnership state, for `decline` only `status`.
        content:
          application/json:
            schema:
              oneOf:
              - $ref: ../components/legacy.yaml#/schemas/Partnership
              - $ref: ../components/legacy.yaml#/schemas/StatusOnly
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
      '409':
        $ref: ../components/legacy.yaml#/responses/Error
      '422':
        $ref: ../components/legacy.yaml#/responses/Error
/api/federation/v1/partnership/discount:
  post:
    tags:
    - Partner instances
    operationId: federationDiscount
    summary: Propose, accept or decline a discount
    description: Until agreed, the previously agreed discount applies.
    security:
    - federationToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/legacy.yaml#/schemas/DiscountAction
    responses:
      '200':
        $ref: ../components/legacy.yaml#/responses/Partnership
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
      '409':
        $ref: ../components/legacy.yaml#/responses/Error
      '422':
        $ref: ../components/legacy.yaml#/responses/Error
/api/federation/v1/partnership/end:
  post:
    tags:
    - Partner instances
    operationId: federationEnd
    summary: End partnership
    description: Afterwards all endpoints respond with `403`.
    security:
    - federationToken: []
    responses:
      '200':
        description: Ended.
        content:
          application/json:
            schema:
              $ref: ../components/legacy.yaml#/schemas/StatusOnly
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
/api/federation/v1/articles:
  get:
    tags:
    - Partner instances
    operationId: federationArticles
    summary: Partner's material pool
    description: Rentable articles with availability in the period, 25 per page.
    security:
    - federationToken: []
    parameters:
    - name: from
      in: query
      description: Start (default today).
      schema:
        type: string
        format: date
    - name: to
      in: query
      description: End (default = `from`).
      schema:
        type: string
        format: date
    - name: q
      in: query
      schema:
        type: string
        maxLength: 100
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    responses:
      '200':
        description: Articles.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/legacy.yaml#/schemas/FederationArticle
                meta:
                  type: object
                  properties:
                    page:
                      type: integer
                    page_size:
                      type: integer
                      example: 25
                    total:
                      type: integer
                    from:
                      type: string
                      format: date
                    to:
                      type: string
                      format: date
                    discount_percent:
                      type: number
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
      '422':
        $ref: ../components/legacy.yaml#/responses/Error
/api/federation/v1/technicians:
  get:
    tags:
    - Partner instances
    operationId: federationTechnicians
    summary: Partner's technicians and trades
    description: Only names are shared, no e-mail addresses.
    security:
    - federationToken: []
    responses:
      '200':
        description: Technicians.
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed:
                  type: boolean
                technicians:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                trades:
                  type: array
                  items:
                    type: string
                  example:
                  - Ton
                  - Licht
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
/api/federation/v1/requests:
  post:
    tags:
    - Partner instances
    operationId: federationCreateRequest
    summary: Submit a material or technician request
    description: |
      Sending the same `reference` again returns the existing state. For material requests with
      "confirm automatically" enabled, the request is confirmed immediately if everything is available.
    security:
    - federationToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/legacy.yaml#/schemas/FederationRequestInput
    responses:
      '201':
        $ref: ../components/legacy.yaml#/responses/FederationRequestState
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
      '422':
        $ref: ../components/legacy.yaml#/responses/Error
/api/federation/v1/requests/{reference}:
  get:
    tags:
    - Partner instances
    operationId: federationRequestStatus
    summary: State of a request made by the sender
    security:
    - federationToken: []
    parameters:
    - $ref: ../components/legacy.yaml#/parameters/Reference
    responses:
      '200':
        $ref: ../components/legacy.yaml#/responses/FederationRequestState
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
      '404':
        $ref: ../components/legacy.yaml#/responses/Error
/api/federation/v1/requests/{reference}/cancel:
  post:
    tags:
    - Partner instances
    operationId: federationCancelRequest
    summary: Cancel request
    security:
    - federationToken: []
    parameters:
    - $ref: ../components/legacy.yaml#/parameters/Reference
    responses:
      '200':
        $ref: ../components/legacy.yaml#/responses/FederationRequestState
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
      '404':
        $ref: ../components/legacy.yaml#/responses/Error
/api/federation/v1/requests/{reference}/status:
  post:
    tags:
    - Partner instances
    operationId: federationReceiveStatus
    summary: Report a decision on a request
    description: The providing partner reports the new state of a request made by
      the recipient.
    security:
    - federationToken: []
    parameters:
    - $ref: ../components/legacy.yaml#/parameters/Reference
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                $ref: ../components/legacy.yaml#/schemas/FederationRequestStatusEnum
              message:
                type: string
                nullable: true
                maxLength: 1000
              discount_percent:
                type: number
                nullable: true
                minimum: 0
                maximum: 100
              items:
                type: array
                items:
                  $ref: ../components/legacy.yaml#/schemas/FederationRequestItem
              technicians:
                type: array
                maxItems: 50
                items:
                  $ref: ../components/legacy.yaml#/schemas/FederationTechnicianStatus
    responses:
      '200':
        $ref: ../components/legacy.yaml#/responses/Ok
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/legacy.yaml#/responses/FederationForbidden
      '404':
        $ref: ../components/legacy.yaml#/responses/Error
/api/payments/sumup/webhook:
  post:
    tags:
    - Online payment
    operationId: sumUpWebhook
    security: []
    summary: SumUp webhook
    description: |
      Notification from SumUp about a checkout. The server maps the checkout ID to the
      corresponding invoice and confirms its online payment. Unknown checkouts are
      ignored; the response is always `{"ok": true}`.
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                maxLength: 100
                description: Checkout ID.
    responses:
      '200':
        $ref: ../components/legacy.yaml#/responses/Ok
