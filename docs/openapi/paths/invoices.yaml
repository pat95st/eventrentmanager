/api/v1/invoices/{id}/email:
  post:
    tags:
    - Invoices
    summary: Send invoice by e-mail
    description: |
      Sends the document as a PDF attachment to `recipient_email` (the e-mail is archived as in the web interface). In addition, a messenger notification is sent as in the web interface (if configured).

      **Scopes:** `invoices:read`, `email:send`
    operationId: InvoicesEmail
    security:
    - apiToken: []
    x-required-scopes:
    - invoices:read
    - email:send
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/EmailInput
    responses:
      '200':
        description: Success.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/EmailResult
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
