# devices interfaces (see docs/*-api.md). Paths are referenced from ../openapi.yaml.
/api/player/v1/pair:
  post:
    tags:
    - Player device
    operationId: playerPair
    summary: Pair device by code
    description: |
      Pairs a device with an event using a 6-digit code (generated in the event under **Audio & Durchsagen**
      (audio & announcements), valid for 15 minutes and for one use only). Requires **no** token.

      If the device additionally sends a valid `Authorization: Bearer <token>`, the existing
      device is assigned to the new event and keeps its token (`token: null`). Otherwise a new
      device is created and its token is returned **once**.
    security:
    - {}
    - playerToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            properties:
              code:
                type: string
                description: Spaces and hyphens are ignored.
                example: '123456'
              name:
                type: string
                description: Device name (default "AutoEventPlay").
                example: Pi mixing desk
              version:
                type: string
                example: 1.0.0
    responses:
      '200':
        description: Paired.
        content:
          application/json:
            schema:
              type: object
              properties:
                ok:
                  type: boolean
                  example: true
                token:
                  type: string
                  nullable: true
                  example: mvp_…
                player:
                  $ref: ../components/legacy.yaml#/schemas/PlayerRef
                rental:
                  $ref: ../components/legacy.yaml#/schemas/PlayerRental
                poll_interval_seconds:
                  type: integer
                  example: 2
      '422':
        description: Code invalid or expired.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/Error
      '429':
        description: 10 failed attempts from the same IP address within 15 minutes.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/Error
/api/player/v1/state:
  get:
    tags:
    - Player device
    operationId: playerState
    summary: Get state, manifest and queue
    description: |
      Polled every `poll_interval_seconds`. When a scheduled playback cue reaches its start
      time, the server automatically adds a job to `queue` during this poll. Jobs that are not
      picked up for too long expire on the server.
    security:
    - playerToken: []
    parameters:
    - name: version
      in: query
      description: Version of the device software (shown in the device overview).
      schema:
        type: string
    - name: playing
      in: query
      description: Plain text describing what is currently playing (e.g. "Opener");
        empty = nothing.
      schema:
        type: string
    responses:
      '200':
        description: Current state.
        content:
          application/json:
            schema:
              $ref: ../components/legacy.yaml#/schemas/PlayerState
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
/api/player/v1/requests/{id}/status:
  post:
    tags:
    - Player device
    operationId: playerReportStatus
    summary: Report the status of a job
    security:
    - playerToken: []
    parameters:
    - $ref: ../components/legacy.yaml#/parameters/RequestId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/legacy.yaml#/schemas/PlayerStatusInput
        application/x-www-form-urlencoded:
          schema:
            $ref: ../components/legacy.yaml#/schemas/PlayerStatusInput
    responses:
      '200':
        $ref: ../components/legacy.yaml#/responses/Ok
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '404':
        description: Job does not belong to this device's event.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/Error
      '422':
        description: Invalid status.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/Error
/api/player/v1/requests/{id}/recording:
  get:
    tags:
    - Player device
    operationId: playerRecording
    summary: Download the microphone recording of a job
    security:
    - playerToken: []
    parameters:
    - $ref: ../components/legacy.yaml#/parameters/RequestId
    responses:
      '200':
        description: Recording (`audio/webm`, `audio/mp4` or `audio/ogg`).
        content:
          audio/*:
            schema:
              type: string
              format: binary
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/legacy.yaml#/responses/Error
/api/player/v1/files/{id}:
  get:
    tags:
    - Player device
    operationId: playerFile
    summary: Download audio file
    description: Supports range requests. Only files of events assigned to the device.
    security:
    - playerToken: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: Range
      in: header
      schema:
        type: string
        example: bytes=0-1023
    responses:
      '200':
        description: File (WAV, FLAC, AAC/M4A or MP3).
        content:
          audio/*:
            schema:
              type: string
              format: binary
      '206':
        description: Partial content (range).
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/legacy.yaml#/responses/Error
/api/player/v1/gong:
  get:
    tags:
    - Player device
    operationId: playerGong
    summary: Download custom gong
    security:
    - playerToken: []
    responses:
      '200':
        description: Gong file.
        content:
          audio/*:
            schema:
              type: string
              format: binary
      '401':
        $ref: ../components/legacy.yaml#/responses/Unauthorized
      '404':
        description: No custom gong uploaded – use the built-in gong.
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/Error
