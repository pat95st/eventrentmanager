    description: |
      Versendet das Dokument als PDF-Anhang an `recipient_email` (der Versand wird wie in der Oberfläche archiviert). Zusätzlich wird wie in der Oberfläche per Messenger benachrichtigt (falls eingerichtet).

      **Scopes:** `invoices:read`, `email:send`
    operationId: InvoicesEmail
    security:
    - apiToken: []
    x-required-scopes:
    - invoices:read
    - email:send
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/EmailInput
