# REST API v1 — rentals. Paths are referenced from ../openapi.yaml.
/api/v1/rentals:
  get:
    tags:
    - Events
    summary: List events
    description: |
      Issuing and returning material (signature, ID and accessory checks) remain in the web interface.

      **Scopes:** `rentals:read`
    operationId: RentalsIndex
    security:
    - apiToken: []
    x-required-scopes:
    - rentals:read
    parameters:
    - name: customer_id
      in: query
      schema:
        type: string
    - $ref: ../components/common.yaml#/parameters/Q
    - $ref: ../components/common.yaml#/parameters/UpdatedSince
    - $ref: ../components/common.yaml#/parameters/Sort
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: List (paginated).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/common.yaml#/schemas/RentalResource
                meta:
                  $ref: ../components/common.yaml#/schemas/ListMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
  post:
    tags:
    - Events
    summary: Create event
    description: |
      **Scopes:** `rentals:write`
    operationId: RentalsStore
    security:
    - apiToken: []
    x-required-scopes:
    - rentals:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/RentalInput
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/common.yaml#/schemas/RentalDetailResource
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '422':
        $ref: ../components/common.yaml#/responses/Unprocessable
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
