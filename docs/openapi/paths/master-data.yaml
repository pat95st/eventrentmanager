# REST API v1 — master-data. Paths are referenced from ../openapi.yaml.
/api/v1/suppliers:
  get:
    tags:
    - Master data
    summary: List suppliers
    description: |
      **Scopes:** `master_data:read`
    operationId: SuppliersIndex
    security:
    - apiToken: []
    x-required-scopes:
    - master_data:read
    parameters:
    - $ref: ../components/common.yaml#/parameters/Q
    - $ref: ../components/common.yaml#/parameters/UpdatedSince
    - $ref: ../components/common.yaml#/parameters/Sort
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: List (paginated).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/generated.yaml#/Supplier
                meta:
                  $ref: ../components/common.yaml#/schemas/ListMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
  post:
    tags:
    - Master data
    summary: Create supplier
    description: |
      **Scopes:** `master_data:write`
    operationId: SuppliersStore
    security:
    - apiToken: []
    x-required-scopes:
    - master_data:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/SupplierInput
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/generated.yaml#/Supplier
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '422':
        $ref: ../components/common.yaml#/responses/Unprocessable
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
