# Root of the OpenAPI description. Build: bin/build-api-docs.sh (bundles docs/openapi/ into api-docs.html).
openapi: 3.0.3
info:
  title: Materialverleih – API
  version: '1.1'
  description: |
    Maschinenlesbare Schnittstellen der Materialverleih-Software.

    Alle Pfade sind relativ zur Basis-URL der Installation, z. B. `https://verleih.example.de`.
    Keine Schnittstelle nutzt Session-Cookies oder CSRF-Schutz.

    | Bereich | Pfad-Präfix | Zugang |
    |---|---|---|
    | **REST-API v1** (Kunden, Artikel, Veranstaltungen, Angebote, Rechnungen, Finanzen, Lager, Berichte) | `/api/v1` | API-Token mit Scopes (*Einstellungen › API*) |
    | Abspielgerät | `/api/player/v1` | Geräte-Token `mvp_…` |
    | Run-Sheet / Stagedisplay | `/api/runsheet/v1/{token}` | Token eines Freigabe-Links |
    | Stage- & FOH-Displays | `/api/display/v1` | Display-Token `mvd_…` |
    | Partner-Instanzen | `/api/federation/v1` | Partnerschafts-Token / Einladungscode |
    | Online-Zahlung | `/api/payments` | – (Webhook) |

    # REST-API v1

    ## Aktivieren und Tokens

    Die API wird unter **Einstellungen › API** eingeschaltet; ausgeschaltet antwortet jeder Endpunkt mit `404`.
    Dort werden auch die Tokens angelegt. Ein Token wird nur einmal angezeigt und bei jeder Anfrage mitgeschickt:

    ```
    Authorization: Bearer mv_…
    ```

    Je Token lassen sich **Scopes**, ein **IP-Filter**, der Schalter **„Nur lesen“** (lehnt jede schreibende Anfrage
    mit `403` ab, egal welche Scopes gesetzt sind) und ein eigenes **Anfragelimit** festlegen.

    ## Scopes

    Jeder Endpunkt nennt die nötigen Scopes („**Scopes:**“); alle genannten müssen gewährt sein. Ein `write`-Scope
    schließt den `read`-Scope nicht ein.

    | Scope | Erlaubt |
    |---|---|
    | `customers:read` | Kunden lesen |
    | `customers:write` | Kunden schreiben |
    | `articles:read` | Artikel lesen (inkl. Inventurnummern, Kategorien, Hersteller, Sets, Verfügbarkeit) |
    | `articles:write` | Artikel schreiben |
    | `master_data:read` | Stammdaten lesen (Lieferanten, Veranstaltungsorte, Lagerorte, Fahrzeuge) |
    | `master_data:write` | Stammdaten schreiben |
    | `rentals:read` | Veranstaltungen lesen (inkl. Positionen, Techniker, Kalender) |
    | `rentals:write` | Veranstaltungen schreiben |
    | `sales:read` | Angebote & Auftragsbestätigungen lesen |
    | `sales:write` | Angebote & Auftragsbestätigungen schreiben |
    | `invoices:read` | Rechnungen lesen (inkl. Korrekturen, Mahnungen) |
    | `invoices:write` | Rechnungsentwürfe schreiben, als bezahlt markieren |
    | `invoices:finalize` | Rechnungen festschreiben & stornieren (vergibt Rechnungsnummer, unumkehrbar) |
    | `finance:read` | Finanzen lesen (Belege, Konten, Bestellungen) |
    | `finance:write` | Finanzen schreiben (Belege, Bestellungen) |
    | `inventory:read` | Lager & Technik lesen (Cases, Racks, RMA, E-Prüfungen, Verkäufe) |
    | `inventory:write` | E-Prüfungen erfassen |
    | `minute_programs:read` | Minutenprogramme lesen |
    | `reports:read` | Berichte lesen |
    | `email:send` | E-Mails an Kunden versenden (Angebote, Rechnungen, Mahnungen, Packlisten) |

    Bestehende Tokens aus der Zeit vor den Scopes haben nur `articles:read` und sind „Nur lesen“.

    ## Konventionen

    - **JSON**: Anfragen mit `Content-Type: application/json`, Felder in `snake_case`. Einzelne Ressourcen kommen als
      `{"data": …}`, Listen als `{"data": [...], "meta": {"page", "page_size", "total", "total_pages"}}`.
    - **Listen** unterstützen `q` (Suche in Textfeldern), `updated_since` (ISO 8601, für den Abgleich nur geänderter
      Datensätze), `sort` (`feld` oder `-feld`) und `page`/`page_size` (Standard 100, höchstens 500).
      Gelöschte Datensätze erscheinen dabei nicht.
    - **Anlegen** per `POST` → `201` mit der neuen Ressource. **Ändern** per `PATCH`: nur die gesendeten Felder ändern
      sich, alles andere bleibt (auch Positionslisten von Belegen, solange sie nicht mitgeschickt werden). Positionslisten
      werden im selben Format zurückgegeben, wie sie geschrieben werden. **Löschen** per `DELETE` → `204`.
    - **Fachaktionen** sind `POST /…/{id}/<aktion>`, z. B. `/offers/{id}/accept` oder `/invoices/{id}/finalize`.
    - Es gelten dieselben Prüfungen und Geschäftsregeln wie in der Weboberfläche.
    - **Fehler** kommen als `{"error": "…"}`; Validierungsfehler (`422`) zusätzlich mit `errors` (Feld → Meldung).
      `401` Token fehlt/ungültig, `403` Scope fehlt oder „Nur lesen“, `404` nicht gefunden, `409` im aktuellen Zustand
      nicht möglich, `429` Limit überschritten, `502` E-Mail-Versand fehlgeschlagen.
    - **Datum/Zeit**: ISO 8601; reine Datumsfelder als `Y-m-d`.
    - **Dateien**: PDFs (`…/pdf`), XRechnung (`…/xrechnung`) und Belegdateien als Download. Uploads (Artikelbilder,
      Belege) als `multipart/form-data` mit der Datei im Feld `file`.

    ## Ratenbegrenzung

    Anfragen werden je Token und Minute gezählt (Standard 600, einstellbar global und je Token; 0 = unbegrenzt).
    Jede Antwort enthält `X-RateLimit-Limit`, `X-RateLimit-Remaining` und `X-RateLimit-Reset` (Unix-Zeit).
    Beim Überschreiten folgt `429` mit `Retry-After` (Sekunden). Gezählt wird in der Datenbank oder in Redis
    (Unix-Socket, TCP oder TLS); ist Redis nicht erreichbar, zählt die API automatisch in der Datenbank weiter.

    ## Protokoll

    Jede schreibende Anfrage (`POST`, `PATCH`, `PUT`, `DELETE`) wird mit Zeit, Token, Pfad, Statuscode und IP
    protokolliert und unter *Einstellungen › API* angezeigt (Aufbewahrung 90 Tage).

    ## Was bleibt in der Weboberfläche?

    Ausgabe und Rücknahme von Material (Unterschrift, Ausweis-/Zubehörprüfung), Rechnungskorrekturen und Mahnungen
    anlegen, Bankimport, DATEV-Export, KI-Funktionen, Benutzer und Einstellungen.

    ---

    Diese Dokumentation wird aus `docs/openapi/` erzeugt: `bin/generate-api-schemas.php` (Felder aus den
    Domain-Klassen), danach `bin/build-api-docs.sh` (ergibt `api-docs.html`).
servers:
- url: https://verleih.example.de
  description: Beispiel-Installation (eigene Basis-URL einsetzen)
tags:
- name: Kunden
  description: Kunden inkl. Ansprechpartnern. Scopes `customers:*`.
- name: Artikel
  description: Artikel, Inventarnummern, Verfügbarkeit, Sets, Kategorien, Hersteller, Arbeitszeit-Artikel. Scopes
    `articles:*`.
- name: Stammdaten
  description: Lieferanten, Veranstaltungsorte, Lagerorte, Fahrzeuge. Scopes `master_data:*`.
- name: Veranstaltungen
  description: Veranstaltungen (Vermietungen), Positionen, Techniker, Kalender, Packliste. Scopes `rentals:*`.
- name: Minutenprogramme
  description: Minutenprogramme und Vorlagen (lesend). Scope `minute_programs:read`.
- name: Angebote
  description: Angebote und Auftragsbestätigungen. Scopes `sales:*`.
- name: Rechnungen
  description: Rechnungen, Rechnungskorrekturen und Mahnungen. Scopes `invoices:*`, Festschreiben mit `invoices:finalize`.
- name: Finanzen
  description: Belege, Bankkonten und Bestellungen. Scopes `finance:*`.
- name: Lager & Technik
  description: Cases, Racks, RMA, Elektroprüfungen, Verkäufe. Scopes `inventory:*`.
- name: Berichte
  description: Auswertungen. Scope `reports:read`.
- name: Abspielgerät
  description: 'Schnittstelle für das Abspielgerät (Raspberry Pi am Mischpult) für Veranstaltungs-Audio:

    Kopplung, Manifest der Audio-Dateien, Warteschlange von Durchsagen/Einspielern und

    Statusrückmeldung. Das Gerät fragt `state` alle `poll_interval_seconds` ab; jede Abfrage

    zählt als Lebenszeichen (offline nach 45 s).


    | `queue[].kind` | Inhalt | Abspielen |

    |---|---|---|

    | `jingle` | `file_id`/`file_url` | Datei aus dem lokalen Cache abspielen |

    | `audio` | `file_id`/`file_url` | Datei abspielen |

    | `tts` | `text`, `language` | ggf. Gong → Text per Sprachausgabe sprechen |

    | `recording` | `recording_url`, `recording_mime` | ggf. Gong → Aufnahme abspielen |

    | `stop` | – | laufende Wiedergabe sofort beenden, dann `done` melden |

    '
- name: Run-Sheet
  description: 'Live-Stand eines Minutenprogramms für Stagedisplays und andere externe Clients.

    Zugang ist der Token eines **Freigabe-Links** des Minutenprogramms: „Nur lesen“ erlaubt

    `GET`, „Lesen & bearbeiten“ zusätzlich die steuernden `POST`-Endpunkte. Wird der Link

    widerrufen, antwortet die API mit `404`. Alle Antworten senden `Access-Control-Allow-Origin: *`.

    '
- name: Display
  description: 'Schnittstelle für fest eingerichtete Stage- und FOH-Displays mit eigenem Geräte-Token.

    Welches Minutenprogramm ein Display zeigt, wird zentral in der Verwaltung festgelegt.

    `runSheet` hat genau das Format der Run-Sheet-API. Steuernde Endpunkte sind nur für

    FOH-Displays mit „Steuern erlauben“ zulässig. CORS ist offen (inkl. `Authorization`).

    '
- name: Partner-Instanzen
  description: 'Server-zu-Server-Protokoll zwischen zwei Installationen („Föderation“). Werte sind immer

    **aus Sicht des Absenders** angegeben (`discount_granted` = Rabatt, den der Absender dem

    Empfänger gewährt). Die Einladungs-Endpunkte werden über den geheimen Code im Pfad

    authentifiziert, alle anderen über den beim Annehmen ausgetauschten Bearer-Token.

    '
- name: Online-Zahlung
  description: Eingehende Benachrichtigungen von Zahlungsanbietern.
x-tagGroups:
