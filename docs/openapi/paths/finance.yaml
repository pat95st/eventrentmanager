# REST API v1 — finance. Paths are referenced from ../openapi.yaml.
/api/v1/receipts:
  get:
    tags:
    - Finanzen
    summary: Belege auflisten
    description: |
      **Scopes:** `finance:read`
    operationId: FinanceReceipts
    security:
    - apiToken: []
    x-required-scopes:
    - finance:read
    parameters:
    - name: supplier_id
      in: query
      schema:
        type: string
    - $ref: ../components/common.yaml#/parameters/Q
    - $ref: ../components/common.yaml#/parameters/UpdatedSince
    - $ref: ../components/common.yaml#/parameters/Sort
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: Liste (seitenweise).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/common.yaml#/schemas/ReceiptResource
                meta:
                  $ref: ../components/common.yaml#/schemas/ListMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
  post:
    tags:
    - Finanzen
    summary: Beleg anlegen
    description: |
      `multipart/form-data`: die Felder unten plus die Datei (PDF/JPG/PNG) im Feld `file`.

      **Scopes:** `finance:write`
    operationId: FinanceStoreReceipt
    security:
    - apiToken: []
    x-required-scopes:
    - finance:write
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            allOf:
            - $ref: ../components/generated.yaml#/ReceiptInput
            - type: object
              properties:
                file:
                  type: string
                  format: binary
    responses:
      '201':
        description: Angelegt.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/common.yaml#/schemas/ReceiptDetailResource
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '422':
        $ref: ../components/common.yaml#/responses/Unprocessable
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
