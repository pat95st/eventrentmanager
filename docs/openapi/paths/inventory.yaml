# REST API v1 — inventory. Paths are referenced from ../openapi.yaml.
/api/v1/cases:
  get:
    tags:
    - Inventory & equipment
    summary: List cases
    description: |
      **Scopes:** `inventory:read`
    operationId: InventoryCases
    security:
    - apiToken: []
    x-required-scopes:
    - inventory:read
    parameters:
    - name: manufacturer_id
      in: query
      schema:
        type: string
    - $ref: ../components/common.yaml#/parameters/Q
    - $ref: ../components/common.yaml#/parameters/UpdatedSince
    - $ref: ../components/common.yaml#/parameters/Sort
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: List (paginated).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/generated.yaml#/CaseItem
                meta:
                  $ref: ../components/common.yaml#/schemas/ListMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
/api/v1/cases/{id}:
  get:
    tags:
    - Inventory & equipment
    summary: Get case
    description: |
      **Scopes:** `inventory:read`
    operationId: InventoryCaseItem
    security:
    - apiToken: []
    x-required-scopes:
    - inventory:read
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    responses:
      '200':
        description: Success.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/common.yaml#/schemas/CaseResource
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
