components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: 'API token from *Einstellungen › API* (Settings › API), sent as
        `Authorization: Bearer mv_…`. The required scopes are listed at each endpoint.'
    playerToken:
      type: http
      scheme: bearer
      description: Device token of the player device (`mvp_…`).
    displayToken:
      type: http
      scheme: bearer
      description: Display token (`mvd_…`), shown once when the display is created
        or the token is regenerated.
    federationToken:
      type: http
      scheme: bearer
      description: Partnership token exchanged when the invitation is accepted.
