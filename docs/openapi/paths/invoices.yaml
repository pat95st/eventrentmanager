  post:
    tags:
    - Invoices
    summary: Finalize invoice
    description: |
      **Irreversible (GoBD):** assigns the sequential invoice number and sets the status to `sent`. Requires the separate scope `invoices:finalize`.

      **Scopes:** `invoices:finalize`
    operationId: InvoicesFinalize
    security:
    - apiToken: []
    x-required-scopes:
    - invoices:finalize
