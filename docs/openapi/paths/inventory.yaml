/api/v1/inventory-numbers/{id}/electrical-inspections:
  get:
    tags:
    - Inventory & equipment
    summary: Electrical inspections of an inventory number
    description: |
      **Scopes:** `inventory:read`
    operationId: InventoryInventoryNumberInspections
    security:
    - apiToken: []
    x-required-scopes:
    - inventory:read
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - $ref: ../components/common.yaml#/parameters/Q
    - $ref: ../components/common.yaml#/parameters/UpdatedSince
    - $ref: ../components/common.yaml#/parameters/Sort
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: List (paginated).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/generated.yaml#/ElectricalInspection
                meta:
                  $ref: ../components/common.yaml#/schemas/ListMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
  post:
    tags:
    - Inventory & equipment
    summary: Record electrical inspection
    description: |
      E.g. from a test device or an app.

      **Scopes:** `inventory:write`
    operationId: InventoryStoreInspection
    security:
    - apiToken: []
    x-required-scopes:
    - inventory:write
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/ElectricalInspectionInput
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/generated.yaml#/ElectricalInspection
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '422':
        $ref: ../components/common.yaml#/responses/Unprocessable
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
