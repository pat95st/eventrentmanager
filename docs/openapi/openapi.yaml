# Root of the OpenAPI description. Build: bin/build-api-docs.sh (bundles docs/openapi/ into api-docs.html).
openapi: 3.0.3
info:
  title: Materialverleih – API
  version: '1.1'
  description: |
    Machine-readable interfaces of the Materialverleih software.

    All paths are relative to the base URL of the installation, e.g. `https://verleih.example.de`.
    No interface uses session cookies or CSRF protection.

    | Area | Path prefix | Access |
    |---|---|---|
    | **REST API v1** (customers, articles, events, offers, invoices, finance, inventory, reports) | `/api/v1` | API token with scopes (*Einstellungen › API*, i.e. Settings › API) |
    | Player device | `/api/player/v1` | Device token `mvp_…` |
    | Run sheet / stage display | `/api/runsheet/v1/{token}` | Token of a share link |
    | Stage & FOH displays | `/api/display/v1` | Display token `mvd_…` |
    | Partner instances | `/api/federation/v1` | Partnership token / invitation code |
    | Online payment | `/api/payments` | – (webhook) |
    | **MCP server** for AI assistants (Claude etc.) | `/mcp` | API token released for MCP (see `docs/mcp.md`) |

    The web interface itself is German; UI labels are quoted in German with an English translation where helpful.

    # REST API v1

    ## Enabling the API and tokens

    The API is switched on under **Einstellungen › API** (Settings › API); while it is switched off, every endpoint
    responds with `404`. Tokens are created there as well. A token is shown only once and must be sent with every request:

    ```
    Authorization: Bearer mv_…
    ```

    Per token you can set **scopes**, an **IP filter**, the **„Nur lesen“** (read only) switch (rejects every write
    request with `403`, regardless of the scopes granted) and an individual **request limit**.

    ## Scopes

    Every endpoint lists the scopes it requires ("**Scopes:**"); all of them must be granted. A `write` scope does
    not include the corresponding `read` scope.

    | Scope | Allows |
    |---|---|
    | `customers:read` | Read customers |
    | `customers:write` | Write customers |
    | `articles:read` | Read articles (incl. inventory numbers, categories, manufacturers, sets, availability) |
    | `articles:write` | Write articles |
    | `master_data:read` | Read master data (suppliers, venues, warehouses, vehicles) |
    | `master_data:write` | Write master data |
    | `rentals:read` | Read events (incl. items, technicians, calendar) |
    | `rentals:write` | Write events |
    | `sales:read` | Read offers & order confirmations |
    | `sales:write` | Write offers & order confirmations |
    | `invoices:read` | Read invoices (incl. corrections, dunning notices) |
    | `invoices:write` | Write invoice drafts, mark invoices as paid |
    | `invoices:finalize` | Finalize & cancel invoices (assigns the invoice number, irreversible) |
    | `finance:read` | Read finance data (receipts, bank accounts, purchase orders) |
    | `finance:write` | Write finance data (receipts, purchase orders) |
    | `inventory:read` | Read inventory & equipment (cases, racks, RMAs, electrical inspections, sales) |
    | `inventory:write` | Record electrical inspections |
    | `minute_programs:read` | Read minute programs |
    | `reports:read` | Read reports |
    | `email:send` | Send e-mails to customers (offers, invoices, dunning notices, packing lists) |

    Tokens created before scopes were introduced only have `articles:read` and are read only.

    ## Conventions

    - **JSON**: requests with `Content-Type: application/json`, fields in `snake_case`. Single resources are returned as
      `{"data": …}`, lists as `{"data": [...], "meta": {"page", "page_size", "total", "total_pages"}}`.
    - **Lists** support `q` (search in text fields), `updated_since` (ISO 8601, to sync only changed records),
      `sort` (`field` or `-field`) and `page`/`page_size` (default 100, at most 500).
      Deleted records are not included.
    - **Create** via `POST` → `201` with the new resource. **Update** via `PATCH`: only the fields sent are changed,
      everything else stays as it is (including the item lists of documents as long as they are not sent). Item lists
      are returned in the same format in which they are written. **Delete** via `DELETE` → `204`.
    - **Business actions** are `POST /…/{id}/<action>`, e.g. `/offers/{id}/accept` or `/invoices/{id}/finalize`.
    - The same validations and business rules apply as in the web interface.
    - **Errors** are returned as `{"error": "…"}`; validation errors (`422`) additionally contain `errors` (field → message).
      `401` token missing/invalid, `403` scope missing or token is read only, `404` not found, `409` not possible in the
      current state, `429` limit exceeded, `502` sending the e-mail failed.
      Error messages are returned in German, as in the web interface.
    - **Date/time**: ISO 8601; date-only fields as `Y-m-d`.
    - **Files**: PDFs (`…/pdf`), XRechnung (`…/xrechnung`) and receipt files as downloads. Uploads (article images,
      receipts) as `multipart/form-data` with the file in the field `file`.

    ## Rate limiting

    Requests are counted per token and minute (default 600, configurable globally and per token; 0 = unlimited).
    Every response contains `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` (Unix time).
    When the limit is exceeded, the API responds with `429` and `Retry-After` (seconds). Requests are counted in the
    database or in Redis (Unix socket, TCP or TLS); if Redis is unreachable, the API automatically falls back to the database.

    ## Log

    Every write request (`POST`, `PATCH`, `PUT`, `DELETE`) is logged with time, token, path, status code and IP address
    and shown under *Einstellungen › API* (Settings › API); entries are kept for 90 days.

    ## What remains in the web interface?

    Issuing and returning material (signature, ID/accessory checks), creating invoice corrections and dunning notices,
    bank import, DATEV export, AI features, users and settings.

    ---

    This documentation is generated from `docs/openapi/`: `bin/generate-api-schemas.php` (fields from the domain
    classes), followed by `bin/build-api-docs.sh` (produces `api-docs.html`).
servers:
- url: https://verleih.example.de
  description: Example installation (use your own base URL)
tags:
- name: Customers
  description: Customers incl. contacts. Scopes `customers:*`.
- name: Articles
  description: Articles, inventory numbers, availability, sets, categories, manufacturers,
    labor time articles. Scopes `articles:*`.
- name: Master data
  description: Suppliers, venues, warehouses, vehicles. Scopes `master_data:*`.
- name: Events
  description: Events (rentals), items, technicians, calendar, packing list. Scopes
    `rentals:*`.
- name: Minute programs
  description: Minute programs and templates (read only). Scope `minute_programs:read`.
- name: Offers
  description: Offers and order confirmations. Scopes `sales:*`.
- name: Invoices
  description: Invoices, invoice corrections and dunning notices. Scopes `invoices:*`,
    finalizing with `invoices:finalize`.
- name: Finance
  description: Receipts, bank accounts and purchase orders. Scopes `finance:*`.
- name: Inventory & equipment
  description: Cases, racks, RMAs, electrical inspections, sales. Scopes `inventory:*`.
- name: Reports
  description: Evaluations. Scope `reports:read`.
- name: Player device
  description: |
    Interface for the player device (Raspberry Pi at the mixing desk) for event audio:
    pairing, manifest of the audio files, queue of announcements/playback cues and
    status reporting. The device polls `state` every `poll_interval_seconds`; every poll
    counts as a heartbeat (offline after 45 s).

    | `queue[].kind` | Content | Playback |
    |---|---|---|
    | `jingle` | `file_id`/`file_url` | Play the file from the local cache |
    | `audio` | `file_id`/`file_url` | Play the file |
    | `tts` | `text`, `language` | Gong if applicable → speak the text via text-to-speech |
    | `recording` | `recording_url`, `recording_mime` | Gong if applicable → play the recording |
    | `stop` | – | Stop the current playback immediately, then report `done` |
- name: Run sheet
  description: |
    Live state of a minute program for stage displays and other external clients.
    Access is granted by the token of a **share link** of the minute program: „Nur lesen“ (read only) allows
    `GET`, „Lesen & bearbeiten“ (read & edit) additionally allows the controlling `POST` endpoints. If the link
    is revoked, the API responds with `404`. All responses send `Access-Control-Allow-Origin: *`.
- name: Display
  description: |
    Interface for permanently installed stage and FOH displays with their own device token.
    Which minute program a display shows is configured centrally in the web interface.
    `runSheet` has exactly the format of the run sheet API. Controlling endpoints are only allowed for
    FOH displays with „Steuern erlauben“ (allow control) enabled. CORS is open (incl. `Authorization`).
- name: Partner instances
  description: |
    Server-to-server protocol between two installations ("federation"). Values are always given
    **from the sender's point of view** (`discount_granted` = discount the sender grants the
    recipient). The invitation endpoints are authenticated by the secret code in the path,
    all others by the bearer token exchanged when the invitation is accepted.
- name: Online payment
  description: Incoming notifications from payment providers.
- name: MCP server
  description: |
    Model Context Protocol server for AI assistants such as Claude. It offers about 30 task-oriented tools on top
    of the REST API v1 (same tokens, scopes, validations, request limit and log). Setup and tool list: `docs/mcp.md`.
x-tagGroups:
- name: 'REST API v1: Master data'
  tags:
