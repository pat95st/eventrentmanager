        $ref: ../components/common.yaml#/responses/TooManyRequests
  post:
    tags:
    - Lager & Technik
    summary: Elektroprüfung erfassen
    description: |
      Z. B. aus einem Prüfgerät oder einer App.

      **Scopes:** `inventory:write`
    operationId: InventoryStoreInspection
    security:
    - apiToken: []
    x-required-scopes:
    - inventory:write
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/ElectricalInspectionInput
    responses:
      '201':
        description: Angelegt.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/generated.yaml#/ElectricalInspection
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
