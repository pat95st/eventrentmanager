# REST API v1 — sales. Paths are referenced from ../openapi.yaml.
/api/v1/offers:
  get:
    tags:
    - Angebote
    summary: Angebote auflisten
    description: |
      Ein Shop kann Anfragen als Angebotsentwurf anlegen.

      **Scopes:** `sales:read`
    operationId: OffersIndex
    security:
    - apiToken: []
    x-required-scopes:
    - sales:read
    parameters:
    - name: status
      in: query
      schema:
        type: string
        enum:
        - draft
        - sent
        - accepted
        - declined
    - $ref: ../components/common.yaml#/parameters/Q
    - $ref: ../components/common.yaml#/parameters/UpdatedSince
    - $ref: ../components/common.yaml#/parameters/Sort
    - $ref: ../components/common.yaml#/parameters/Page
    - $ref: ../components/common.yaml#/parameters/PageSize
    responses:
      '200':
        description: Liste (seitenweise).
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/common.yaml#/schemas/OfferResource
                meta:
                  $ref: ../components/common.yaml#/schemas/ListMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
  post:
    tags:
    - Angebote
    summary: Angebot anlegen
    description: |
      **Scopes:** `sales:write`
    operationId: OffersStore
    security:
    - apiToken: []
    x-required-scopes:
    - sales:write
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/generated.yaml#/OfferInput
    responses:
      '201':
        description: Angelegt.
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: ../components/common.yaml#/schemas/OfferDetailResource
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '422':
        $ref: ../components/common.yaml#/responses/Unprocessable
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
