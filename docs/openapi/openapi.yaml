components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: 'API-Token aus *Einstellungen › API* (`Authorization: Bearer mv_…`). Die nötigen Scopes stehen
        beim jeweiligen Endpunkt.'
    playerToken:
      type: http
      scheme: bearer
      description: Geräte-Token des Abspielgeräts (`mvp_…`).
    displayToken:
      type: http
      scheme: bearer
      description: Display-Token (`mvd_…`), wird beim Anlegen bzw. Neu-Erzeugen einmal angezeigt.
    federationToken:
      type: http
      scheme: bearer
      description: Beim Annehmen der Einladung ausgetauschter Partnerschafts-Token.
