/api/v1/bank-accounts/{id}/ledger:
  get:
    tags:
    - Finance
    summary: Account transactions of a period
    description: |
      **Scopes:** `finance:read`
    operationId: FinanceLedger
    security:
    - apiToken: []
    x-required-scopes:
    - finance:read
    parameters:
    - $ref: ../components/common.yaml#/parameters/Id
    - name: period
      in: query
      schema:
        type: string
        enum:
        - monat
        - jahr
        - jahre
        default: jahr
    - name: date
      in: query
      description: Reference date within the desired period (Y-m-d), default today.
      schema:
        type: string
        format: date
    responses:
      '200':
        description: Success.
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/common.yaml#/schemas/LedgerEntry
                meta:
                  $ref: ../components/common.yaml#/schemas/LedgerMeta
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/common.yaml#/responses/Forbidden
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '429':
        $ref: ../components/common.yaml#/responses/TooManyRequests
